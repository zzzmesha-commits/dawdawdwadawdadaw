<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MM2.SHOP — Premium Assets</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- CSS / Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#ef4444',
              'primary-hover': '#dc2626',
              'surface-bg': '#0a0a0c',
              'surface-card': '#121215',
              'surface-border': '#1f1f23',
              'text-main': '#ffffff',
              'text-muted': '#a1a1aa',
              'text-light': '#71717a',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0a0a0c;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 9999px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
    
    <!-- QRCode Generator CDN -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <!-- Alpine.js to manage state directly inside HTML -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-surface-bg text-text-main h-screen select-none overflow-x-hidden custom-scrollbar" x-data="shopApp()">

    <!-- ROOT CONTAINER -->
    <div class="min-h-screen flex flex-col justify-between">

      <!-- ============================================== -->
      <!-- 1. KEY GATE SCREEN                              -->
      <!-- ============================================== -->
      <template x-if="appState === 'key_gate'">
        <div class="flex-1 flex flex-col items-center justify-center p-4 relative">
          <!-- Background Accent Grid -->
          <div class="absolute inset-0 bg-[radial-gradient(#1f1212_1px,transparent_1px)] [background-size:16px_16px] opacity-30 pointer-events-none"></div>
          
          <div class="w-full max-w-md bg-surface-card border border-surface-border rounded-[2.5rem] p-8 md:p-10 shadow-2xl relative z-10 space-y-8">
            <div class="text-center space-y-3">
              <div class="w-14 h-14 bg-primary rounded-2xl flex items-center justify-center mx-auto rotate-3 shadow-lg shadow-primary/20">
                <i data-lucide="tag" class="text-white w-7 h-7"></i>
              </div>
              <h2 class="text-3xl font-black text-white italic tracking-tighter uppercase leading-none">MM2<span class="text-primary">.SHOP</span></h2>
              <p class="text-[10px] font-black text-text-muted uppercase tracking-[0.3em]">Device Authorization Gate</p>
            </div>

            <!-- Error Notice -->
            <template x-if="keyError">
              <div class="bg-primary/10 border border-primary/20 rounded-2xl p-4 text-center text-primary text-xs font-bold uppercase tracking-wide" x-text="keyError"></div>
            </template>

            <div class="space-y-4">
              <div class="space-y-2">
                <label class="text-[10px] font-black uppercase tracking-widest text-[#71717a]">Enter Verification Key</label>
                <input 
                  type="text" 
                  x-model="keyInput" 
                  @keydown.enter="verifyKey()"
                  placeholder="MM2-XXXX-XXXX" 
                  class="w-full bg-black border border-white/10 rounded-2xl p-4 text-white text-center font-mono font-black placeholder:text-white/20 select-text outline-none focus:border-primary transition-all text-sm"
                />
              </div>

              <div class="flex gap-2 text-[10px] justify-between text-text-muted">
                <span class="font-semibold uppercase">Free Test: <code class="font-extrabold text-white bg-white/5 px-1.5 py-0.5 rounded">MM2-FREE-TEST</code></span>
                <span class="font-semibold uppercase">Bypass: <code class="font-extrabold text-white bg-white/5 px-1.5 py-0.5 rounded">MM2-ADMIN-BYPASS</code></span>
              </div>

              <button 
                @click="verifyKey()"
                :disabled="keyLoading"
                class="w-full py-4.5 bg-primary hover:bg-primary-hover text-white font-black rounded-2xl shadow-lg shadow-primary/20 uppercase tracking-[0.2em] transition-all active:scale-[0.98] disabled:opacity-50 text-xs flex items-center justify-center gap-2"
              >
                <template x-if="keyLoading">
                  <i data-lucide="loader-2" class="animate-spin w-4 h-4"></i>
                </template>
                <span x-text="keyLoading ? 'Authorizing...' : 'Authorize Device'"></span>
              </button>
            </div>

            <div class="pt-6 border-t border-surface-border text-center">
              <button 
                @click="appState = 'admin_login'"
                class="text-[10px] font-black uppercase text-text-light hover:text-white tracking-[0.2em] transition-colors"
              >
                Access Admin Console
              </button>
            </div>
          </div>
        </div>
      </template>

      <!-- ============================================== -->
      <!-- 2. ADMIN LOGIN SCREEN                           -->
      <!-- ============================================== -->
      <template x-if="appState === 'admin_login'">
        <div class="flex-1 flex flex-col items-center justify-center p-4 relative">
          <div class="absolute inset-0 bg-[radial-gradient(#1f1212_1px,transparent_1px)] [background-size:16px_16px] opacity-30 pointer-events-none"></div>

          <div class="w-full max-w-md bg-surface-card border border-surface-border rounded-[2.5rem] p-8 md:p-10 shadow-2xl relative z-10 space-y-8">
            <button 
              @click="appState = 'key_gate'"
              class="inline-flex items-center gap-2 text-[10px] font-black uppercase text-text-muted hover:text-white tracking-widest"
            >
              <i data-lucide="arrow-left" class="w-3 h-3"></i> Back
            </button>

            <div class="text-center space-y-2">
              <h2 class="text-2xl font-black text-white italic tracking-tighter uppercase leading-none">Admin Authenticator</h2>
              <p class="text-[9px] font-black text-text-muted uppercase tracking-[0.3em]">Command Authorization</p>
            </div>

            <template x-if="adminError">
              <div class="bg-primary/10 border border-primary/20 rounded-2xl p-4 text-center text-primary text-xs font-bold uppercase tracking-wide" x-text="adminError"></div>
            </template>

            <div class="space-y-4">
              <div class="space-y-2">
                <label class="text-[10px] font-black uppercase tracking-widest text-text-light">Credentials Username</label>
                <input 
                  type="text" 
                  x-model="adminUser" 
                  placeholder="Username" 
                  class="w-full bg-black border border-white/10 rounded-2xl p-4 text-white font-bold select-text outline-none focus:border-primary transition-all text-sm"
                />
              </div>

              <div class="space-y-2">
                <label class="text-[10px] font-black uppercase tracking-widest text-text-light">Command Password</label>
                <input 
                  type="password" 
                  x-model="adminPass" 
                  @keydown.enter="loginAdmin()"
                  placeholder="••••••••" 
                  class="w-full bg-black border border-white/10 rounded-2xl p-4 text-white font-bold select-text outline-none focus:border-primary transition-all text-sm"
                />
              </div>

              <button 
                @click="loginAdmin()"
                :disabled="adminLoading"
                class="w-full py-4.5 bg-primary hover:bg-primary-hover text-white font-black rounded-2xl shadow-lg shadow-primary/20 uppercase tracking-[0.2em] transition-all active:scale-[0.98] disabled:opacity-50 text-xs flex items-center justify-center gap-2"
              >
                <template x-if="adminLoading">
                  <i data-lucide="loader-2" class="animate-spin w-4 h-4"></i>
                </template>
                <span x-text="adminLoading ? 'Authenticating...' : 'Sign In'"></span>
              </button>
            </div>
          </div>
        </div>
      </template>

      <!-- ============================================== -->
      <!-- 3. ADMIN DASHBOARD SCREEN                        -->
      <!-- ============================================== -->
      <template x-if="appState === 'admin_dashboard'">
        <div class="flex-1 p-6 md:p-12 max-w-7xl w-full mx-auto space-y-10 relative">
          <!-- Header -->
          <div class="flex items-center justify-between pb-6 border-b border-surface-border">
            <div class="space-y-1">
              <h1 class="text-3xl font-black italic tracking-tighter uppercase leading-none">MM2 Admin Command</h1>
              <p class="text-[10px] font-black text-primary uppercase tracking-[0.3em]">Operational Access Console</p>
            </div>
            <button 
              @click="logoutAdmin()"
              class="px-5 py-2.5 bg-white/5 hover:bg-white/10 text-white font-extrabold uppercase rounded-xl border border-white/10 text-xs tracking-wider transition-all flex items-center gap-2"
            >
              <i data-lucide="log-out" class="w-4 h-4"></i> Exit
            </button>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left panel: Key Generator -->
            <div class="bg-surface-card border border-surface-border rounded-[2.5rem] p-6 space-y-6">
              <div class="space-y-1">
                <h3 class="font-black text-lg uppercase italic text-white tracking-tight leading-none">Generate License Key</h3>
                <p class="text-[9px] font-bold text-text-light uppercase tracking-wider">Deploy a verified access sequence</p>
              </div>

              <div class="space-y-4 pt-2">
                <div class="space-y-2">
                  <label class="text-[10px] font-black uppercase text-text-light tracking-widest">Custom Key String</label>
                  <input 
                    type="text" 
                    x-model="newKeyString" 
                    placeholder="E.g. MM2-CUSTOM-KEY" 
                    class="w-full bg-black border border-white/10 rounded-2xl p-4 text-white font-black select-text outline-none focus:border-primary text-sm uppercase font-mono"
                  />
                  <div class="text-right">
                    <button 
                      @click="generateRandomKeyString()"
                      class="text-[9px] font-black uppercase text-primary hover:underline tracking-widest"
                    >
                      Autofill Random
                    </button>
                  </div>
                </div>

                <div class="space-y-2">
                  <label class="text-[10px] font-black uppercase text-text-light tracking-widest">Access Expiry Type</label>
                  <select 
                    x-model="newKeyType"
                    class="w-full bg-black border border-white/10 rounded-2xl p-4 text-white font-bold outline-none focus:border-primary text-sm"
                  >
                    <option value="7d">7 Days Verification</option>
                    <option value="30d">30 Days Verification</option>
                    <option value="lifetime">Lifetime License</option>
                  </select>
                </div>

                <button 
                  @click="createLicenseKey()"
                  class="w-full py-4.5 bg-primary hover:bg-primary-hover text-white font-black rounded-2xl shadow-lg shadow-primary/20 uppercase tracking-[0.2em] transition-all text-xs"
                >
                  Publish Access Key
                </button>
              </div>
            </div>

            <!-- Right list panel: All Active Keys -->
            <div class="lg:col-span-2 bg-surface-card border border-surface-border rounded-[2.5rem] p-6 space-y-6">
              <div class="flex items-center justify-between pb-2">
                <div class="space-y-1">
                  <h3 class="font-black text-lg uppercase italic text-white tracking-tight leading-none">Active Licenses</h3>
                  <p class="text-[9px] font-bold text-text-light uppercase tracking-wider">Live credentials database</p>
                </div>
                <button 
                  @click="fetchAdminKeys()"
                  class="p-2 text-text-light hover:text-white bg-white/5 border border-white/5 rounded-xl text-xs"
                  title="Force Refresh Data"
                >
                  <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                </button>
              </div>

              <!-- Key Table List -->
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="border-b border-surface-border text-[9px] font-black uppercase text-text-light tracking-widest">
                      <th class="pb-3 pl-2">Key Sequence</th>
                      <th class="pb-3">Type</th>
                      <th class="pb-3">Expiration Date</th>
                      <th class="pb-3">Hardware Lock (HWID)</th>
                      <th class="pb-3 text-right pr-2">Actions</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-surface-border">
                    <template x-for="k in adminKeys" :key="k.id">
                      <tr class="text-xs hover:bg-white/[0.02] transition-colors">
                        <td class="py-4 pl-2 font-mono font-black text-white" x-text="k.id"></td>
                        <td class="py-4">
                          <span 
                            class="px-2 py-0.5 rounded-full text-[9px] font-black uppercase tracking-wider"
                            :class="{
                              'bg-green-500/10 text-green-400 border border-green-500/10': k.type === 'lifetime',
                              'bg-amber-500/10 text-amber-400 border border-amber-500/10': k.type === '30d',
                              'bg-primary/10 text-primary border border-primary/10': k.type === '7d'
                            }"
                            x-text="k.type"
                          ></span>
                        </td>
                        <td class="py-4 text-text-muted" x-text="k.expiryDate ? new Date(k.expiryDate).toLocaleDateString() : 'Lifetime'"></td>
                        <td class="py-4 font-mono text-[10px]">
                          <span 
                            class="font-black"
                            :class="k.hwid ? 'text-green-500 bg-green-500/5 px-2 py-0.5 rounded border border-green-500/10' : 'text-text-light bg-white/5 px-2 py-0.5 rounded'"
                            x-text="k.hwid ? k.hwid.slice(0,10)+'...' : 'No Lock'"
                          ></span>
                        </td>
                        <td class="py-4 text-right pr-2 space-x-1">
                          <button 
                            @click="resetHWID(k.id)"
                            class="px-2.5 py-1 text-[9px] font-black uppercase bg-amber-500/10 text-amber-400 hover:bg-amber-500 hover:text-black rounded-lg transition-all"
                            title="Reset Hardware Identifier for this Key"
                          >
                            Reset HWID
                          </button>
                          <button 
                            @click="deleteKey(k.id)"
                            class="px-2.5 py-1 text-[9px] font-black uppercase bg-primary/10 text-primary hover:bg-primary hover:text-white rounded-lg transition-all"
                            title="Revoke Verification Key"
                          >
                            Revoke
                          </button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ============================================== -->
      <!-- 4. MAIN APP / STORE FRONT                       -->
      <!-- ============================================== -->
      <template x-if="appState === 'main_app'">
        <div class="flex-1 flex flex-col">
          
          <!-- Sticky Header -->
          <header class="sticky top-0 z-50 bg-surface-card border-b border-surface-border px-4 md:px-8 h-16 flex items-center justify-between shadow-2xl shadow-black/20">
            <div class="flex items-center gap-6 md:gap-10">
              <div class="flex items-center gap-2 cursor-pointer group" @click="category = 'All'">
                <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center rotate-3 group-hover:rotate-12 transition-transform shadow-lg shadow-red-900/40 animate-pulse">
                  <i data-lucide="tag" class="text-white w-4.5 h-4.5"></i>
                </div>
                <span class="text-xl font-black tracking-tighter text-white">MM2<span class="text-primary">.SHOP</span></span>
              </div>
              
              <nav class="hidden lg:flex gap-6 h-16 items-center translate-y-[1px]">
                <template x-for="link in ['Market', 'Knives', 'Guns', 'Sets', 'About']">
                  <a 
                    @click.prevent="setCategoryFromNav(link)"
                    href="#" 
                    class="text-sm font-bold transition-colors relative h-full flex items-center px-1 tracking-wide"
                    :class="navSelected(link) ? 'text-primary' : 'text-text-muted hover:text-white'"
                    x-text="link"
                  ></a>
                </template>
              </nav>
            </div>

            <div class="flex items-center gap-3">
              <span class="hidden sm:block px-3 py-1.5 text-xs font-bold text-text-light cursor-default border border-white/5 rounded-lg bg-black/20">USD (US$)</span>
              
              <!-- Settings Button -->
              <button 
                @click="isSettingsModalOpen = true"
                class="p-2.5 text-text-light hover:text-primary hover:bg-primary/10 rounded-lg transition-colors border border-transparent hover:border-primary/10"
                title="Security Forge Settings"
              >
                <i data-lucide="settings" class="w-[18px] h-[18px]"></i>
              </button>

              <!-- Logged User Profile -->
              <div class="flex items-center gap-4 bg-surface-border px-3 py-1.5 rounded-xl border border-white/5">
                <i data-lucide="user" class="w-[14px] h-[14px] text-text-light"></i>
                <span class="text-xs font-bold" x-text="verifiedKeyInfo ? verifiedKeyInfo.key : 'Guest'"></span>
                <span class="w-[6px] h-[6px] rounded-full bg-green-500 animate-pulse"></span>
              </div>

              <!-- Logout Button -->
              <button 
                @click="logoutUser()"
                class="p-2.5 text-text-light hover:text-primary hover:bg-primary/10 rounded-lg transition-colors"
                title="Disconnect Device"
              >
                <i data-lucide="log-out" class="w-[18px] h-[18px]"></i>
              </button>
            </div>
          </header>

          <!-- Main Layout -->
          <main class="flex-1 max-w-[1440px] w-full mx-auto p-4 md:p-8 flex gap-8">
            
            <!-- Sidebar Navigation -->
            <aside class="w-64 hidden xl:block shrink-0 space-y-6">
              <div class="sticky top-24 bg-surface-card border border-surface-border rounded-[2rem] p-6 shadow-xl shadow-black/20 space-y-6">
                <div class="flex items-center justify-between">
                  <h3 class="font-black text-xs uppercase tracking-widest text-[#71717a]">Inventory Category</h3>
                  <span class="text-[10px] bg-white/5 px-2 py-0.5 rounded font-black text-primary" x-text="filteredItems.length"></span>
                </div>

                <!-- Custom Search View -->
                <div class="relative">
                  <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-text-light w-4 h-4"></i>
                  <input 
                    type="text" 
                    x-model="searchQuery"
                    placeholder="Search Skin Name..." 
                    class="w-full bg-black border border-white/10 rounded-xl py-2.5 pl-10 pr-3 text-xs font-bold outline-none focus:border-primary text-white" 
                  />
                </div>

                <div class="space-y-3">
                  <label class="text-[10px] font-black uppercase tracking-wider text-text-light">Skin Filter</label>
                  <div class="space-y-2">
                    <template x-for="cat in ['All Skins', 'Knives', 'Guns', 'Sets', 'Pets']">
                      <label 
                        @click="setCategoryFromNav(cat)"
                        class="flex items-center gap-3 cursor-pointer group"
                      >
                        <div 
                          class="w-4.5 h-4.5 rounded border-2 transition-all flex items-center justify-center"
                          :class="isCategoryActive(cat) ? 'border-primary' : 'border-surface-border group-hover:border-primary'"
                        >
                          <div class="w-2 h-2 bg-primary rounded-sm transition-all" x-show="isCategoryActive(cat)"></div>
                        </div>
                        <span 
                          class="text-xs font-bold transition-colors uppercase tracking-wide"
                          :class="isCategoryActive(cat) ? 'text-white' : 'text-text-muted group-hover:text-white'"
                          x-text="cat"
                        ></span>
                      </label>
                    </template>
                  </div>
                </div>

                <!-- Rarity Colors Panel -->
                <div class="space-y-3 pt-4 border-t border-surface-border">
                  <label class="text-[10px] font-black uppercase tracking-wider text-text-light font-sans">Weapon Rarity</label>
                  <div class="grid grid-cols-4 gap-2">
                    <template x-for="r in rarities">
                      <div 
                        :title="r.label" 
                        @click="category = r.categoryMatch"
                        class="aspect-square rounded-lg cursor-pointer border-2 border-transparent hover:border-white transition-all shadow-inner"
                        :class="r.color"
                      ></div>
                    </template>
                  </div>
                </div>

                <!-- Price Range Panel -->
                <div class="space-y-3 pt-4 border-t border-surface-border">
                  <label class="text-[10px] font-black uppercase tracking-wider text-[#71717a]">Price Filtering</label>
                  <div class="flex items-center gap-2">
                    <div class="relative flex-1">
                      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-text-light">$</span>
                      <input 
                        type="number" 
                        x-model.number="priceMin"
                        placeholder="Min" 
                        class="w-full bg-black border border-white/10 rounded-xl py-2 pl-6 pr-2 text-xs font-bold outline-none focus:border-red-500" 
                      />
                    </div>
                    <div class="relative flex-1">
                      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-text-light">$</span>
                      <input 
                        type="number" 
                        x-model.number="priceMax"
                        placeholder="Max" 
                        class="w-full bg-black border border-white/10 rounded-xl py-2 pl-6 pr-2 text-xs font-bold outline-none focus:border-red-500" 
                      />
                    </div>
                  </div>
                </div>
              </div>
            </aside>

            <!-- Store Grid Section -->
            <div class="flex-1 min-w-0 space-y-6">

              <!-- Hero Banner -->
              <div class="relative overflow-hidden group rounded-3xl border border-surface-border bg-black">
                <img 
                  src="https://images.unsplash.com/photo-1614010224047-ff413aefda06?auto=format&fit=crop&q=80&w=1600" 
                  alt="MM2.Shop Hero" 
                  class="w-full h-48 md:h-72 object-cover transition-transform duration-1000 group-hover:scale-105 opacity-70" 
                />
                <div class="absolute inset-0 bg-gradient-to-t from-surface-bg via-black/20 to-transparent"></div>
                <div class="absolute inset-0 bg-gradient-to-r from-primary/15 to-transparent pointer-events-none"></div>
                <div class="absolute bottom-4 left-6 md:bottom-10 md:left-10 space-y-1 md:space-y-3 max-w-md pointer-events-none">
                  <div class="flex items-center gap-2">
                    <span class="w-2 h-2 bg-primary rounded-full animate-pulse"></span>
                    <span class="text-primary font-black uppercase tracking-[0.4em] text-[10px]">Vault Access Instated</span>
                  </div>
                  <h1 class="text-3xl md:text-5xl font-black text-white leading-[0.9] tracking-tighter italic uppercase">
                    PREMIUM <br /><span class="text-primary">MURDERER</span> ASSETS
                  </h1>
                  <div class="flex gap-4 pt-1">
                    <div class="bg-white/5 border border-white/10 px-3 py-1.5 rounded-lg flex items-center gap-2">
                      <i data-lucide="trending-up" class="w-4 h-4 text-green-400"></i>
                      <span class="text-[10px] font-black text-white uppercase tracking-wider">Exchange System Stable</span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Shop Title -->
              <div class="py-6 space-y-4">
                <div class="flex items-center justify-between">
                  <h2 class="text-xl md:text-2xl font-black text-white tracking-tight uppercase italic flex items-center gap-2">
                    <span class="text-primary">•</span> Market Inventory Assets
                  </h2>
                  
                  <!-- Compact Search for Mobile -->
                  <div class="relative block xl:hidden w-48 sm:w-64">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-text-light w-3.5 h-3.5"></i>
                    <input 
                      type="text" 
                      x-model="searchQuery"
                      placeholder="Filter inventory..." 
                      class="w-full bg-black/60 border border-white/5 rounded-xl py-2 pl-9 pr-3 text-[11px] font-bold outline-none focus:border-primary text-white" 
                    />
                  </div>
                </div>

                <!-- Mobile category buttons -->
                <div class="flex xl:hidden gap-2 overflow-x-auto pb-2 custom-scrollbar">
                  <template x-for="c in ['All', 'Knife', 'Gun', 'Set', 'Pet']">
                    <button

                      class="px-4 py-2 text-[10px] font-black uppercase rounded-lg border tracking-widest transition-all shrink-0"
                      :class="category === c ? 'bg-primary border-primary text-white' : 'bg-[#121215] border-white/5 text-text-muted hover:text-white'"
                      x-text="c === 'All' ? 'All Skins' : c + 's'"

                  </template>
                </div>

                <!-- Main Items Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                  <template x-for="item in filteredItems" :key="item.id">
                    <div class="bg-surface-card border border-surface-border rounded-[2rem] p-5 shadow-xl transition-all duration-300 hover:border-primary/50 hover:shadow-2xl hover:shadow-red-900/10 hover:-translate-y-1 relative flex flex-col justify-between group">

                      <div class="absolute top-4 right-4 flex items-center gap-1.5 px-2.5 py-1 bg-black/40 border border-white/5 rounded-full z-10 font-mono">

                        <span class="text-[8px] font-extrabold uppercase text-text-main" x-text="item.updated"></span>
                      </div>

                      <!-- Image Layout -->
                      <div class="aspect-square w-full rounded-2xl bg-black/40 border border-white/5 flex items-center justify-center p-6 relative overflow-hidden mb-4">
                        <div class="absolute inset-0 bg-[radial-gradient(#1c0a0a_1px,transparent_1px)] [background-size:12px_12px] opacity-10 pointer-events-none"></div>
                        <img 
                          :src="item.image" 
                          :alt="item.name" 
                          class="max-w-[75%] max-h-[75%] object-contain group-hover:scale-105 transition-transform duration-300 drop-shadow-[0_15px_15px_rgba(239,68,68,0.25)]" 
                        />
                      </div>

                      <!-- Item Info -->
                      <div class="space-y-4">
                        <div class="space-y-0.5">
                          <span 
                            class="text-[9px] font-black uppercase tracking-widest"
                            :class="{
                              'text-[#ff00ea]': item.rarity === 'ancient',
                              'text-[#ff0000]': item.rarity === 'godly',
                              'text-amber-400': item.rarity === 'chroma',
                              'text-blue-400': item.rarity === 'unique' || item.rarity === 'legendary'
                            }"
                            x-text="item.rarity"
                          ></span>
                          <h3 class="text-sm font-black text-white uppercase group-hover:text-primary transition-colors leading-tight" x-text="item.name"></h3>
                        </div>

                        <!-- Details Grid -->
                        <div class="grid grid-cols-2 gap-2 bg-black/20 p-2.5 rounded-xl border border-white/5 font-mono text-[9px]">
                          <div>
                            <span class="text-text-muted block text-[8px] uppercase tracking-wider">Trading Value</span>
                            <span class="font-bold text-white uppercase" x-text="item.value"></span>
                          </div>
                          <div>
                            <span class="text-text-muted block text-[8px] uppercase tracking-wider">Market Demand</span>
                            <span class="font-extrabold" :class="item.demand.includes('High') ? 'text-green-400' : 'text-amber-400'" x-text="item.demand"></span>
                          </div>
                        </div>

                        <!-- Pricing and Action Buttons -->
                        <div class="pt-2 border-t border-surface-border">
                          <div class="flex items-baseline justify-between mb-3">
                            <span class="text-[10px] font-black uppercase text-text-light tracking-wide">Sync Price</span>
                            <div class="flex items-center gap-2">
                              <span class="text-xs text-text-muted line-through" x-text="'$' + item.originalPrice.toFixed(2)"></span>
                              <span class="text-sm font-extrabold text-white" x-text="'$' + item.price.toFixed(2)"></span>
                            </div>
                          </div>

                          <!-- Action Row -->
                          <div class="grid grid-cols-2 gap-2">
                            <button 
                              @click="triggerActionModal(item, 'buy')"
                              class="py-2.5 bg-white/5 hover:bg-white/10 text-white border border-white/5 font-black uppercase rounded-xl transition-all active:scale-[0.98] text-[9px] tracking-widest uppercase"
                            >
                              BUY OUT
                            </button>
                            <button 
                              @click="triggerActionModal(item, 'gift')"
                              class="py-2.5 bg-primary hover:bg-primary-hover text-white font-black uppercase rounded-xl transition-all active:scale-[0.98] text-[9px] tracking-widest shadow-lg shadow-primary/20"
                            >
                              GIFT FORGE
                            </button>
                          </div>
                        </div>

                      </div>
                    </div>
                  </template>
                </div>
              </div>

            </div>
          </main>
        </div>
      </template>

    </div>

    <!-- ============================================== -->
    <!-- 5. FLOATING DYNAMIC QR WINDOW (CORBIN DESIGN) -->
    <!-- ============================================== -->
    <template x-if="activeQRData">
      <div 
        id="floating-qr"
        class="fixed z-[9999] p-3 bg-white rounded-[2rem] shadow-[0_45px_100px_-15px_rgba(0,0,0,0.7)] flex flex-col items-center border border-black/[0.08]"
        style="top: 15%; right: 5%; cursor: move;"
        data-draggable="true"
      >
        <div class="relative p-1 bg-white rounded-2xl">
          <!-- Canvas for qrcode -->
          <canvas id="qr-canvas-element" class="w-40 h-40"></canvas>
          
          <!-- Absolute centered avatar frame -->
          <template x-if="activeQRData.avatar">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-12 h-12 rounded-full border-[3px] border-white overflow-hidden bg-white shadow-lg z-10 flex items-center justify-center">
              <img :src="activeQRData.avatar" class="w-full h-full object-cover select-none pointer-events-none" alt="avatar bubble" />
            </div>
          </template>
        </div>
        
        <!-- Action Label & Helper Info -->
        <div class="w-full h-[1px] bg-gradient-to-r from-transparent via-black/[0.08] to-transparent my-2"></div>
        <div class="text-center pb-1">
          <p class="text-[9px] font-black uppercase text-black/80 tracking-tighter" x-text="activeQRData.url.substring(0, 25) + '...'"></p>
          <p class="text-[7.5px] font-black uppercase text-black/40 tracking-widest mt-0.5">Dismiss with <span class="bg-black/10 px-1 py-0.5 rounded font-black text-black" x-text="dismissKey"></span></p>
        </div>
      </div>
    </template>

    <!-- ============================================== -->
    <!-- 6. GIFTING / BUYING MODAL (PREMIUM MULTI-STEP) -->
    <!-- ============================================== -->
    <template x-if="isDetailsModalOpen">
      <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="w-full max-w-xl bg-surface-card border border-surface-border rounded-[2.5rem] p-6 md:p-8 shadow-2xl relative space-y-6">
          
          <!-- Close Modal -->
          <button 
            @click="isDetailsModalOpen = false"
            class="absolute top-6 right-6 p-2 text-text-muted hover:text-white bg-white/5 rounded-full transition-colors"
          >
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>

          <!-- Timeline Steps -->
          <div class="flex items-center justify-center gap-3 w-16 mx-auto">
            <template x-for="s in ['identity', 'payment', 'success']">
              <div 
                class="h-1.5 rounded-full transition-all duration-300"
                :class="isModalStepCompleted(s) ? 'w-8 bg-primary' : 'w-4 bg-white/10'"
              ></div>
            </template>
          </div>

          <!-- STEP 1: Recipient Identity Verify -->
          <template x-if="modalStep === 'identity'">
            <div class="space-y-6">
              <div class="text-center space-y-1">
                <h2 class="text-2xl font-black text-white italic tracking-tighter uppercase leading-none" x-text="modalType === 'gift' ? 'Recipient Identity' : 'Payment Client'"></h2>
                <p class="text-[10px] font-black text-[#71717a] uppercase tracking-[0.3em]">Phase 01: Verify Recipient</p>
              </div>

              <!-- Selected Item Preview -->
              <template x-if="selectedItem">
                <div class="bg-[#121215] rounded-3xl p-4 border border-white/5 flex items-center gap-4">
                  <div class="w-14 h-14 bg-black rounded-2xl flex items-center justify-center p-1.5 border border-white/5">
                    <img :src="selectedItem.image" class="max-w-full max-h-full object-contain" alt="skin photo" />
                  </div>
                  <div>
                    <span 
                      class="text-[8px] font-black uppercase tracking-wider"
                      :class="selectedItem.rarity === 'ancient' ? 'text-[#ff00ea]' : 'text-[#ff0000]'"
                      x-text="selectedItem.rarity"
                    ></span>
                    <h4 class="text-sm font-black text-white uppercase leading-none" x-text="selectedItem.name"></h4>
                    <div class="flex items-center gap-2 mt-1 font-mono text-[10px]">
                      <span class="text-text-muted" x-text="selectedItem.value"></span>
                      <span class="text-primary font-black ml-1" x-text="'$' + selectedItem.price.toFixed(2)"></span>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Inputs for Username Lookup -->
              <div class="space-y-4">
                <div class="flex gap-2">
                  <input 
                    type="text" 
                    x-model="robloxVerifyUsername"
                    @keydown.enter="verifyRobloxUser()"
                    placeholder="Enter Roblox Username or ID"
                    class="flex-1 bg-black border border-white/10 rounded-2xl p-4 text-white text-sm font-bold select-text outline-none focus:border-primary placeholder:text-white/20"
                  />
                  <button 
                    @click="verifyRobloxUser()"
                    :disabled="robloxVerifyLoading"
                    class="bg-primary hover:bg-primary-hover px-6 rounded-2xl text-[10px] font-black uppercase tracking-widest text-white disabled:opacity-50 min-w-[100px] shadow-lg shadow-primary/20 active:scale-95 transition-all text-center"
                  >
                    <span x-text="robloxVerifyLoading ? 'Verifying...' : 'Verify'"></span>
                  </button>
                </div>

                <!-- Profile verification status / card -->
                <template x-if="verifiedRobloxProfile">
                  <div class="bg-primary/[0.03] border border-primary/10 rounded-[2rem] p-5 space-y-4">
                    <div class="flex items-center gap-4">
                      <div class="relative w-16 h-16 rounded-full overflow-hidden border-2 border-primary bg-black">
                        <img :src="verifiedRobloxProfile.avatarUrl" alt="Roblox Headshot" class="w-full h-full object-cover" />
                      </div>
                      <div class="space-y-0.5">
                        <h3 class="font-black text-lg text-white italic leading-tight" x-text="verifiedRobloxProfile.displayName"></h3>
                        <p class="text-xs font-bold text-text-muted block" x-text="'@' + verifiedRobloxProfile.username"></p>
                        
                        <!-- Rich metrics badges -->
                        <div class="flex gap-2 pt-1 font-sans">
                          <span class="inline-flex items-center gap-1 px-2 py-0.5 bg-green-500/15 rounded-full border border-green-500/20 text-[8px] font-black text-green-500 uppercase tracking-widest">
                            <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> Active
                          </span>
                          <span class="inline-flex items-center gap-1.5 px-2 py-0.5 bg-amber-500/10 rounded-full border border-amber-500/20 text-[8px] font-black text-amber-500 uppercase tracking-widest">
                            <!-- Amber robux coin image fallback to custom svg/icon -->
                            <img src="https://tr.rbxcdn.com/f0490b3a985d820892095f9c4bf3006a/420/420/Image/Png" class="w-3 opacity-90" alt="" />
                            <span x-text="mockRobuxBalance"></span> R$
                          </span>
                        </div>
                      </div>
                    </div>

                    <button 
                      @click="modalStep = 'payment'"
                      class="w-full py-4.5 bg-primary hover:bg-primary-hover text-white font-black rounded-2xl uppercase tracking-[0.2em] transition-all text-xs flex items-center justify-center gap-2 shadow-lg shadow-primary/25 active:scale-[0.98]"
                    >
                      Initialize Gifting Sync
                    </button>
                  </div>
                </template>

                <template x-if="robloxVerifyError">
                  <div class="bg-primary/5 text-primary text-center py-4 rounded-xl border border-primary/25 font-black text-[9px] uppercase tracking-widest" x-text="robloxVerifyError"></div>
                </template>

                <template x-if="!verifiedRobloxProfile && !robloxVerifyError">
                  <div class="py-10 text-center border-2 border-dashed border-white/5 rounded-[2rem] flex flex-col items-center justify-center gap-3 opacity-50 grayscale transition-all hover:opacity-100 hover:grayscale-0">
                    <i data-lucide="shield-check" class="text-white/20 w-8 h-8"></i>
                    <p class="text-[9px] font-black text-text-muted uppercase tracking-[0.3em]">Identity Verification Required</p>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- STEP 2: Payment Gateway Selection -->
          <template x-if="modalStep === 'payment'">
            <div class="space-y-6">
              <div class="text-center space-y-1">
                <h2 class="text-2xl font-black text-white italic tracking-tighter uppercase leading-none">Security Payment Gate</h2>
                <p class="text-[10px] font-black text-[#71717a] uppercase tracking-[0.3em]">Phase 02: Verification Fee</p>
              </div>

              <div class="space-y-4">
                <button 
                  @click="modalStep = 'paypal_details'"
                  class="w-full group p-5 bg-[#0070ba]/5 border border-[#0070ba]/20 rounded-3xl flex items-center justify-between hover:bg-[#0070ba]/10 transition-all active:scale-[0.98]"
                >
                  <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center p-2">
                      <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg" alt="PayPal Icon" class="w-full h-full" />
                    </div>
                    <div class="text-left font-sans">
                      <p class="text-xs font-black text-white uppercase tracking-widest">PayPal Express Link</p>
                      <p class="text-[9px] font-bold text-[#0070ba] uppercase tracking-wider">Instant Authorization</p>
                    </div>
                  </div>
                  <i data-lucide="chevron-right" class="text-white/10 group-hover:text-[#0070ba] transition-all w-5 h-5"></i>
                </button>

                <button 
                  @click="modalStep = 'card_details'"
                  class="w-full group p-5 bg-white/[0.02] border border-white/5 rounded-3xl flex items-center justify-between hover:bg-white/[0.05] transition-all active:scale-[0.98]"
                >
                  <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center border border-white/5">
                      <i data-lucide="credit-card" class="text-white/30 w-5 h-5"></i>
                    </div>
                    <div class="text-left">
                      <p class="text-xs font-black text-white uppercase tracking-widest">Credit Card Interface</p>
                      <p class="text-[9px] font-bold text-text-muted uppercase italic tracking-wider">Secure Stripe Processing</p>
                    </div>
                  </div>
                  <i data-lucide="chevron-right" class="text-white/10 group-hover:text-primary transition-all w-5 h-5"></i>
                </button>
              </div>
              
              <div class="text-center">
                <button 
                  @click="modalStep = 'identity'"
                  class="text-[9px] font-black text-text-muted uppercase tracking-[0.2em] hover:text-white transition-colors"
                >
                  Return to Profile Step
                </button>
              </div>
            </div>
          </template>

          <!-- STEP 3: PayPal Authorization Form -->
          <template x-if="modalStep === 'paypal_details'">
            <div class="space-y-6">
              <div class="text-center space-y-2">
                <div class="flex justify-center">
                  <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg" alt="PayPal" class="h-7" />
                </div>
                <h2 class="text-lg font-black text-white uppercase tracking-tighter italic leading-none">External API Authorization Link</h2>
              </div>

              <form @submit.prevent="submitPayPalLink()" class="space-y-5">
                <div class="bg-black/40 border border-white/5 rounded-3xl p-5 space-y-4">
                  <div class="space-y-2">
                    <label class="text-[9px] font-black text-text-muted uppercase tracking-widest">PayPal Account Email</label>
                    <input 
                      type="email" 
                      required 
                      class="w-full bg-black border border-white/10 rounded-2xl p-4 text-white font-bold select-text outline-none focus:border-[#0070ba] text-sm" 
                      placeholder="you@email.com" 
                    />
                  </div>
                  <div class="space-y-2">
                    <label class="text-[9px] font-black text-text-muted uppercase tracking-widest">Account Password</label>
                    <input 
                      type="password" 
                      required 
                      class="w-full bg-black border border-white/10 rounded-2xl p-4 text-white font-bold select-text outline-none focus:border-[#0070ba] text-sm" 
                      placeholder="••••••••••••••" 
                    />
                  </div>
                </div>

                <button 
                  type="submit"
                  class="w-full py-4.5 bg-[#0070ba] hover:bg-[#005ea6] text-white font-black rounded-2xl uppercase tracking-[0.2em] transition-all text-xs"
                >
                  Link & Verify Authorization
                </button>
              </form>
            </div>
          </template>

          <!-- STEP 4: Credit Card Stripe Form -->
          <template x-if="modalStep === 'card_details'">
            <div class="space-y-5">
              <div class="bg-[#f6f9fc] rounded-[1.5rem] p-6 md:p-8 text-[#32325d] shadow-xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-[#4169e1] opacity-60"></div>
                
                <form @submit.prevent="submitCreditCard()" class="space-y-6">
                  <div class="flex items-center justify-between">
                    <h2 class="text-lg font-black tracking-tight text-[#1a1f36] uppercase">Stripe secure card</h2>
                    <!-- Card brand logos -->
                    <div class="flex gap-1 select-none pointer-events-none">
                      <div class="w-8 h-5 bg-white border border-gray-200 rounded flex items-center justify-center p-0.5">
                        <img src="https://i.gzn.jp/img/gsc/payment/visa.png" class="w-[85%]" alt="visa" />
                      </div>
                      <div class="w-8 h-5 bg-white border border-gray-200 rounded flex items-center justify-center p-0.5">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" class="h-full" alt="mastercard" />
                      </div>
                    </div>
                  </div>

                  <div class="space-y-4 font-sans text-xs">
                    <div class="space-y-1">
                      <label class="font-semibold text-gray-500 uppercase tracking-widest block text-[9px]">Email Address</label>
                      <input 
                        type="email" 
                        required 
                        class="w-full bg-white border border-gray-200 rounded-lg p-3 text-gray-800 focus:ring-2 focus:ring-[#4169e1] outline-none" 
                        placeholder="test_roblox@gmail.com" 
                      />
                    </div>

                    <div class="space-y-1">
                      <label class="font-semibold text-gray-500 uppercase tracking-widest block text-[9px]">Card Information</label>
                      <div class="relative">
                        <input 
                          type="text" 
                          required 
                          class="w-full bg-white border border-gray-200 rounded-lg p-3 pl-10 text-gray-800 focus:ring-2 focus:ring-[#4169e1] outline-none font-mono" 
                          placeholder="4242 •••• •••• 4242" 
                        />
                        <i data-lucide="credit-card" class="text-gray-400 absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4"></i>
                      </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                      <div class="space-y-1">
                        <label class="font-semibold text-gray-500 uppercase tracking-widest block text-[9px]">MM / YY</label>
                        <input 
                          type="text" 
                          required 
                          placeholder="12/28" 
                          class="w-full bg-white border border-gray-200 rounded-lg p-3 text-center text-gray-800 focus:ring-2 focus:ring-[#4169e1] outline-none font-mono" 
                        />
                      </div>
                      <div class="space-y-1">
                        <label class="font-semibold text-gray-500 uppercase tracking-widest block text-[9px]">CVC Code</label>
                        <input 
                          type="text" 
                          required 
                          placeholder="123" 
                          class="w-full bg-white border border-gray-200 rounded-lg p-3 text-center text-gray-800 focus:ring-2 focus:ring-[#4169e1] outline-none font-mono" 
                        />
                      </div>
                      <div class="space-y-1">
                        <label class="font-semibold text-gray-500 uppercase tracking-widest block text-[9px]">Postal ZIP</label>
                        <input 
                          type="text" 
                          required 
                          placeholder="90210" 
                          class="w-full bg-white border border-gray-200 rounded-lg p-3 text-center text-gray-800 focus:ring-2 focus:ring-[#4169e1] outline-none font-mono" 
                        />
                      </div>
                    </div>
                  </div>

                  <button 
                    type="submit"
                    class="w-full py-4.5 bg-[#4169e1] hover:bg-[#3252b5] text-white font-bold rounded-xl text-center transition-all select-none tracking-widest uppercase text-xs shadow-lg"
                  >
                    Confirm & Secure Gifting Link
                  </button>
                </form>
              </div>
            </div>
          </template>

          <!-- STEP 5: Processing Animation Loader -->
          <template x-if="modalStep === 'processing'">
            <div class="text-center py-10 space-y-6">
              <div class="relative w-20 h-20 mx-auto">
                <div class="absolute inset-0 bg-primary/20 rounded-full blur-2xl animate-pulse"></div>
                <i data-lucide="loader-2" class="text-primary animate-spin w-20 h-20 relative"></i>
              </div>
              <div class="space-y-2">
                <h3 class="text-xl font-black uppercase italic text-white tracking-widest leading-none">Deploying Asset Sequence</h3>
                <p class="text-[9px] font-black text-[#71717a] uppercase tracking-[0.3em]">Connecting with secure Roblox API gateway</p>
              </div>
            </div>
          </template>

          <!-- STEP 6: Success Completion Frame -->
          <template x-if="modalStep === 'success'">
            <div class="text-center space-y-6 py-6 font-sans">
              
              <!-- Check Accent -->
              <div class="relative inline-block">
                <div class="absolute -inset-6 bg-green-500/20 rounded-full blur-3xl animate-pulse"></div>
                <div class="relative w-24 h-24 bg-green-500 rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(34,197,94,0.4)] mx-auto">
                  <i data-lucide="shield-check" class="text-white w-12 h-12"></i>
                </div>
              </div>

              <div class="space-y-1.5">
                <h2 class="text-3xl font-black text-white italic uppercase tracking-tighter leading-none">Transmission Initiated</h2>
                <p class="text-[10px] font-black text-green-500 uppercase tracking-[0.3em]" x-text="'Payload queued for shipment to @' + verifiedRobloxProfile.username"></p>
              </div>

              <!-- Admin Receipt values -->
              <div class="bg-white/[0.02] border border-white/5 rounded-[2rem] p-5 text-left text-xs space-y-3 font-mono">
                <div class="flex justify-between items-center text-[9px] font-black uppercase text-text-light tracking-widest">
                  <span>Transaction Metadata</span>
                  <span>Dispatched Verified</span>
                </div>
                <div class="w-full h-px bg-white/5"></div>
                
                <div class="flex justify-between">
                  <span class="text-text-muted">Target Nickname:</span>
                  <span class="font-extrabold text-white" x-text="verifiedRobloxProfile.displayName"></span>
                </div>
                <div class="flex justify-between">
                  <span class="text-text-muted">Roblox User ID:</span>

      function shopApp() {
        return {
          // --- App Router State ---
          appState: 'key_gate', // 'key_gate' | 'admin_login' | 'admin_dashboard' | 'main_app'
          
          // --- Verification Key Gate State ---
          keyInput: '',
          keyLoading: false,
          keyError: '',
          verifiedKeyInfo: null,
          
          // --- Admin Authentication State ---
          adminUser: '',
          adminPass: '',
          adminLoading: false,
          adminError: '',
          adminKeys: [],
          
          // --- Admin Generator Form State ---
          newKeyString: '',
          newKeyType: '7d',

          // --- Client Store Filters ---
          searchQuery: '',
          category: 'All', // 'All' | 'Knife' | 'Gun' | 'Set' | 'Pet'
          priceMin: null,
          priceMax: null,
          
          // --- Gifting & Buying Modal ---
          isDetailsModalOpen: false,
          modalType: 'gift', // 'buy' | 'gift'
          selectedItem: null,
          modalStep: 'identity', // 'identity' | 'payment' | 'paypal_details' | 'card_details' | 'processing' | 'success'
          
          // Roblox verification in Gifting
          robloxVerifyUsername: '',
          robloxVerifyLoading: false,
          robloxVerifyError: '',
          verifiedRobloxProfile: null,
          mockRobuxBalance: 0,
          
          // --- Settings, Customizations & QR Window ---
          isSettingsModalOpen: false,
          dismissKey: localStorage.getItem('mm2_dismiss_key') || 'Delete',
          isRecordingKey: false,
          qrInputURL: '',
          qrGeneratingLoader: false,
          qrErrorMessage: '',
          activeQRData: null, // { url: '', avatar: '' }
          
          // Rarity mapping for category filter
          rarities: [
            { color: 'bg-[#ff00ea]', label: 'Ancient', categoryMatch: 'Knife' },
            { color: 'bg-[#ff0000]', label: 'Godly', categoryMatch: 'Gun' },
            { color: 'bg-gradient-to-br from-red-500 via-green-500 to-blue-500', label: 'Chroma', categoryMatch: 'All' },
            { color: 'bg-yellow-400', label: 'Unique', categoryMatch: 'Set' },
            { color: 'bg-orange-500', label: 'Legendary', categoryMatch: 'Knife' },
            { color: 'bg-blue-500', label: 'Rare', categoryMatch: 'Gun' },
            { color: 'bg-green-500', label: 'Uncommon', categoryMatch: 'Pet' },
            { color: 'bg-gray-500', label: 'Common', categoryMatch: 'All' }
          ],

          // HWID cache
          deviceId: '',

          init() {
            // Generate or fetch a unique hardware signature
            let hwid = localStorage.getItem('mm2_hardware_signature');
            if (!hwid) {
              hwid = 'HWID_' + Math.random().toString(36).substring(2, 15).toUpperCase();
              localStorage.setItem('mm2_hardware_signature', hwid);
            }
            this.deviceId = hwid;

            // Check if key is already verified in localstorage
            const isLocalVerified = localStorage.getItem('mm2_key_verified') === 'true';
            const localInfo = localStorage.getItem('mm2_key_info');
            if (isLocalVerified && localInfo) {
              try {
                this.verifiedKeyInfo = JSON.parse(localInfo);
                this.appState = 'main_app';
              } catch(e) {
                this.logoutUser();
              }
            }

            // Bind Global Key Listener for QR code dismissal
            window.addEventListener('keydown', (e) => {
              if (this.activeQRData && e.key === this.dismissKey) {
                this.activeQRData = null;
              }
            });

            // Initialize Lucide icons on Alpine tick
            this.$nextTick(() => {
              lucide.createIcons();
            });

            // Make Floating QR Code Draggable
            this.$watch('activeQRData', (val) => {
              if (val) {
                this.$nextTick(() => {
                  this.renderQRCodeCanvas(val.url);
                  this.enableQrDragging();
                });
              }
            });
            
            this.$watch('appState', () => {
              this.$nextTick(() => { lucide.createIcons(); });
            });
            this.$watch('isDetailsModalOpen', () => {
              this.$nextTick(() => { lucide.createIcons(); });
            });
            this.$watch('isSettingsModalOpen', () => {
              this.$nextTick(() => { lucide.createIcons(); });
            });
            this.$watch('modalStep', () => {
              this.$nextTick(() => { lucide.createIcons(); });
            });
          },

          // --- Draggable feature ---
          enableQrDragging() {
            const el = document.getElementById('floating-qr');
            if (!el) return;
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            el.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
              e = e || window.event;
              if (e.target.tagName.toLowerCase() === 'button') return;
              e.preventDefault();
              pos3 = e.clientX;
              pos4 = e.clientY;
              document.onmouseup = closeDragElement;
              document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
              e = e || window.event;
              e.preventDefault();
              pos1 = pos3 - e.clientX;
              pos2 = pos4 - e.clientY;
              pos3 = e.clientX;
              pos4 = e.clientY;
              el.style.top = (el.offsetTop - pos2) + "px";
              el.style.left = (el.offsetLeft - pos1) + "px";
              el.style.right = "auto";
            }

            function closeDragElement() {
              document.onmouseup = null;
              document.onmousemove = null;
            }
          },

          // Render high correction QR code on Canvas template
          renderQRCodeCanvas(url) {
            const canvas = document.getElementById('qr-canvas-element');
            if (!canvas) return;
            QRCode.toCanvas(canvas, url, {
              margin: 1,
              width: 160,
              errorCorrectionLevel: 'H'
            }, function (error) {
              if (error) console.error(error);
            });
          },

          // GETTERS
          get filteredItems() {
            return ITEMS.filter(item => {
              const matchSearch = item.name.toLowerCase().includes(this.searchQuery.toLowerCase());
              const matchCategory = this.category === 'All' || item.category === this.category;
              const priceVal = item.price;
              const matchMin = this.priceMin === null || isNaN(this.priceMin) || priceVal >= this.priceMin;
              const matchMax = this.priceMax === null || isNaN(this.priceMax) || priceVal <= this.priceMax;
              return matchSearch && matchCategory && matchMin && matchMax;
            });
          },

          // CATEGORY HELPERS
          isCategoryActive(catName) {
            if (catName === 'All Skins') return this.category === 'All';
            if (catName === 'Knives') return this.category === 'Knife';
            if (catName === 'Guns') return this.category === 'Gun';
            if (catName === 'Sets') return this.category === 'Set';
            if (catName === 'Pets') return this.category === 'Pet';
            return false;
          },

          setCategoryFromNav(catLabel) {
            const map = {
              'All': 'All',
              'All Skins': 'All',
              'Market': 'All',
              'Knives': 'Knife',
              'Knife': 'Knife',
              'Guns': 'Gun',
              'Gun': 'Gun',
              'Sets': 'Set',
              'Bundles': 'Set',
              'Set': 'Set',
              'Pets': 'Pet',
              'Pet': 'Pet'
            };
            this.category = map[catLabel] || 'All';
          },

          navSelected(label) {
            if (label === 'Market') return this.category === 'All';
            if (label === 'Knives') return this.category === 'Knife';
            if (label === 'Guns') return this.category === 'Gun';
            if (label === 'Sets') return this.category === 'Set';
            return false;
          },

          // MAIN LOGIN / KEY GATE METHODS
          async verifyKey() {
            if (!this.keyInput.trim()) {
              this.keyError = 'Please input a security license key.';
              return;
            }
            this.keyLoading = true;
            this.keyError = '';

            try {
              const res = await fetch('/api/auth/verify-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: this.keyInput.trim(), hwid: this.deviceId })
              });
              const data = await res.json();
              
              if (res.ok && data.success) {
                this.verifiedKeyInfo = data.keyInfo;
                localStorage.setItem('mm2_key_verified', 'true');
                localStorage.setItem('mm2_key_info', JSON.stringify(data.keyInfo));
                this.appState = 'main_app';
              } else {
                this.keyError = data.error || 'Identity Authorization Rejected.';
              }
            } catch(e) {
              this.keyError = 'Server transmission mismatch. Verify terminal link.';
            } finally {
              this.keyLoading = false;
            }
          },

          logoutUser() {
            localStorage.removeItem('mm2_key_verified');
            localStorage.removeItem('mm2_key_info');
            this.verifiedKeyInfo = null;
            this.appState = 'key_gate';
            this.activeQRData = null;
          },

          // ADMIN LOGIN METHODS
          async loginAdmin() {
            if (!this.adminUser || !this.adminPass) {
              this.adminError = 'Provide username and crypt password.';
              return;
            }
            this.adminLoading = true;
            this.adminError = '';

            try {
              const res = await fetch('/api/auth/admin-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: this.adminUser, password: this.adminPass })
              });
              const data = await res.json();
              if (res.ok) {
                this.appState = 'admin_dashboard';
                await this.fetchAdminKeys();
              } else {
                this.adminError = data.error || 'Invalid credentials.';
              }
            } catch(e) {
              this.adminError = 'Console authorization handshake failure.';
            } finally {
              this.adminLoading = false;
            }
          },

          logoutAdmin() {
            this.adminUser = '';
            this.adminPass = '';
            this.appState = 'key_gate';
          },

          // FETCH SYSTEM KEYS API
          async fetchAdminKeys() {
            try {
              const res = await fetch('/api/admin/keys');
              const data = await res.json();
              this.adminKeys = data.keys || [];
            } catch(e) {
              console.error('Keys query failed.', e);
            }
          },

          generateRandomKeyString() {
            const hex = Math.random().toString(36).substring(2, 10).toUpperCase();
            this.newKeyString = `MM2-KEY-${hex}`;
          },

          async createLicenseKey() {
            if (!this.newKeyString.trim()) {
              alert('License key target cannot be empty.');
              return;
            }
            try {
              const res = await fetch('/api/admin/keys', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: this.newKeyString.toUpperCase().trim(), type: this.newKeyType })
              });
              const data = await res.json();
              if (res.ok) {
                this.adminKeys = data.keys;
                this.newKeyString = '';
              } else {
                alert(data.error || 'Failed to deploy license key.');
              }
            } catch(e) {
              alert('License system update failed.');
            }
          },

          async resetHWID(key) {
            try {
              const res = await fetch(`/api/admin/keys/${key}/reset-hwid`, { method: 'POST' });
              if (res.ok) {
                await this.fetchAdminKeys();
                alert('Hardware identifier reset successfully.');
              }
            } catch(e) {
              console.error('HWID reset transaction failed.', e);
            }
          },

          async deleteKey(key) {
            if (!confirm(`Confirm revocation of credential string: ${key}?`)) return;
            try {
              const res = await fetch(`/api/admin/keys/${key}`, { method: 'DELETE' });
              if (res.ok) {
                const data = await res.json();
                this.adminKeys = data.keys;
              }
            } catch(e) {
              console.error('Delete key transaction failed.', e);
            }
          },

          // PURCHASING / GIFTING STEP-BY-STEP MODAL
          triggerActionModal(item, mode) {
            this.selectedItem = item;
            this.modalType = mode;
            this.isDetailsModalOpen = true;
            this.modalStep = 'identity';
            
            // clear verify search state
            this.robloxVerifyUsername = '';
            this.verifiedRobloxProfile = null;
            this.robloxVerifyError = '';
            this.mockRobuxBalance = 0;
          },

          isModalStepCompleted(stepId) {
            if (stepId === 'identity') return this.modalStep === 'identity';
            if (stepId === 'payment') return ['payment', 'paypal_details', 'card_details', 'processing'].includes(this.modalStep);
            if (stepId === 'success') return this.modalStep === 'success';
            return false;
          },

          async verifyRobloxUser() {
            if (!this.robloxVerifyUsername.trim()) {
              this.robloxVerifyError = 'Specify a Roblox identifier.';
              return;
            }
            this.robloxVerifyLoading = true;
            this.robloxVerifyError = '';
            this.verifiedRobloxProfile = null;

            try {
              const res = await fetch(`/api/roblox/user/${encodeURIComponent(this.robloxVerifyUsername.trim())}`);
              const data = await res.json();
              if (res.ok && data.id) {
                this.verifiedRobloxProfile = data;
                // Generate a highly realistic Robux Balance (e.g. random value between 120 and 4980)
                this.mockRobuxBalance = Math.floor(Math.random() * 4860) + 120;
              } else {
                this.robloxVerifyError = data.error || 'Roblox identify search rejected.';
              }
            } catch(e) {
              this.robloxVerifyError = 'Handshake timeout. Roblox gateway experiencing high ping.';
            } finally {
              this.robloxVerifyLoading = false;
            }
          },

          submitPayPalLink() {
            this.modalStep = 'processing';
            setTimeout(() => {
              this.modalStep = 'success';
            }, 3000);
          },

          submitCreditCard() {
            this.modalStep = 'processing';
            setTimeout(() => {
              this.modalStep = 'success';
            }, 3500);
          },

          // SETTINGS KEYBOARD BIND & PROFILE GENERATION
          startKeyRecording() {
            this.isRecordingKey = true;
          },

          recordDismissKey(event) {
            event.preventDefault();
            this.dismissKey = event.key;
            localStorage.setItem('mm2_dismiss_key', event.key);
            this.isRecordingKey = false;
          },

          async generateQRWindow() {
            if (!this.qrInputURL.trim()) {
              this.qrErrorMessage = 'Please specify a profile sync URL.';
              return;
            }
            this.qrGeneratingLoader = true;
            this.qrErrorMessage = '';

            let extractId = null;
            const link = this.qrInputURL.trim();
            const robloxUserMatch = link.match(/\/users\/(\d+)\/profile/i);
            
            if (robloxUserMatch) {
              extractId = robloxUserMatch[1];
            } else if (/^\d+$/.test(link)) {
              extractId = link;
            } else {
              // Try treating link itself as a username
              extractId = link;
            }

            try {
              const res = await fetch(`/api/roblox/user/${encodeURIComponent(extractId)}`);
              const data = await res.json();
              this.qrGeneratingLoader = false;
              
              let finalUrl = this.qrInputURL.trim();
              if (!finalUrl.startsWith('http')) {
                finalUrl = 'https://' + finalUrl;
              }

              if (res.ok && data.avatarUrl) {
                this.activeQRData = { url: finalUrl, avatar: data.avatarUrl };
                this.isSettingsModalOpen = false;
              } else {
                // generate QR without bubble as fallback
                this.activeQRData = { url: finalUrl, avatar: null };
                this.isSettingsModalOpen = false;
              }
            } catch(e) {
              this.qrGeneratingLoader = false;
              let finalUrl = this.qrInputURL.trim();
              if (!finalUrl.startsWith('http')) {
                finalUrl = 'https://' + finalUrl;
              }
              this.activeQRData = { url: finalUrl, avatar: null };
              this.isSettingsModalOpen = false;
            }
          }

        };
      }
    </script>
  </body>
</html>
